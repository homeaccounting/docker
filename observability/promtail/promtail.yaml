server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Ship ONLY the api container's stdout to Loki. server-infra (Spec 2) emits one
  # JSON object per stdout line, so the raw log line stays JSON and is queried in
  # Grafana with LogQL `| json`.
  #
  # Filtering happens at DISCOVERY (docker_sd filters), not via a relabel `keep`:
  # with docker_sd, a relabel-dropped target still gets its logs tailed and pushed
  # label-less (Loki then 400s "at least one label pair is required per stream").
  # A discovery-level label filter means non-api containers are never tailed.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.service=api"]
    relabel_configs:
      # Low-cardinality labels only: job, container, level. correlationId /
      # userId / msg deliberately stay log FIELDS (queried via `| json`), never
      # labels — matches the tracker#49 cardinality discipline.
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: job
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
    pipeline_stages:
      # Parse the JSON line only to promote `level` to a label; the original
      # line is preserved as the log body.
      - json:
          expressions:
            level: level
      - labels:
          level:
